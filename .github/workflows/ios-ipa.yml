# Flutter iOS 云打包（不签名）→ 下载 ipa 后用爱思自己的 Apple ID 签名安装

name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter/**'
      - '.github/workflows/ios-ipa.yml'
    branches:
      - main
      - master

jobs:
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Show Flutter podspec requirement
        run: |
          ls -la ios/Flutter || true
          find "$(dirname "$(which flutter)")/../.." -name "Flutter.podspec" 2>/dev/null | head -5 || true
          PODSPEC=$(find "$FLUTTER_ROOT" -path "*/bin/cache/artifacts/engine/ios*/Flutter.podspec" 2>/dev/null | head -1)
          if [ -n "$PODSPEC" ]; then
            echo "PODSPEC=$PODSPEC"
            cat "$PODSPEC"
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install --verbose

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Pack Payload → unsigned.ipa
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -name "*.app" -type d | head -n 1)
          fi
          echo "Using app: $APP_PATH"
          rm -rf Payload unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r unsigned.ipa Payload
          ls -lh unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: jisuxiongmao-ios-unsigned
          path: flutter/unsigned.ipa
          if-no-files-found: error
          retention-days: 14
